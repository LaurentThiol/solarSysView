name: sync-fdj

on:
  workflow_dispatch:
  schedule:
    # Mardi et vendredi 21h45 Europe/Paris (après le tirage ~21h05)
    - cron: "45 19 * * 2,5"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m synchro sync
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
