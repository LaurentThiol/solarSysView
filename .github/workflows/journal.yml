name: Journal

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: journal-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  brouillon:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Préparer le brouillon
        id: draft
        env:
          PR_JSON: ${{ toJson(github.event.pull_request) }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          printf '%s' "$PR_JSON" > "$RUNNER_TEMP/pr.json"
          git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null || git fetch --no-tags origin "${BASE_SHA}"
          git diff --name-only "${BASE_SHA}...HEAD" > "$RUNNER_TEMP/files.txt"
          git log --format=%s "${BASE_SHA}..HEAD" > "$RUNNER_TEMP/commits.txt"
          python -m synchro.journal_pr \
            "$RUNNER_TEMP/pr.json" \
            "$RUNNER_TEMP/files.txt" \
            "$RUNNER_TEMP/commits.txt" \
            "$RUNNER_TEMP/journal-comment.md"
          if [ -s "$RUNNER_TEMP/journal-comment.md" ]; then
            echo "post=true" >> "$GITHUB_OUTPUT"
          else
            echo "post=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Commenter une fois
        if: steps.draft.outputs.post == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          existing="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments?per_page=100" \
            --jq '[.[] | select(.body != null and (.body | contains("synchro-journal-draft")))] | length')"
          if [ "$existing" != "0" ]; then
            exit 0
          fi
          gh pr comment "$PR" --body-file "$RUNNER_TEMP/journal-comment.md"
